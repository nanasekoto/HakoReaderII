plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.nanase.hako'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.nanase.hako'
        minSdk 26
        targetSdk 34
        ndk { abiFilters(project.findProperty("abi") ?: "armeabi-v7a") }
        versionCode 14
        versionName '0.7.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile file('../test-signing.p12')
            storePassword 'android'
            keyAlias 'hako-test'
            keyPassword 'android'
            storeType 'PKCS12'
        }
        release {
            storeFile file('../test-signing.p12')
            storePassword 'android'
            keyAlias 'hako-test'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview:${project.findProperty('geckoVersion') ?: rootProject.file('gecko-version.txt').text.trim()}"
    implementation 'androidx.core:core:1.12.0'
    implementation 'org.jsoup:jsoup:1.18.3'
}


