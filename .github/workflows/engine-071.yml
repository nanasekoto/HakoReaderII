name: Build Gecko reading and shelf features
on:
  push:
    branches: [ 'fix/shelf-anchor-card-corners-0713' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Check cached chapter regression
        run: |
          mkdir -p build/cache-check
          timeout 30 javac -d build/cache-check app/src/main/java/vn/nanase/hako/CachePolicy.java tests/CachePolicyTest.java
          timeout 15 java -cp build/cache-check vn.nanase.hako.CachePolicyTest
      - name: Check unique queue regression
        run: |
          timeout 30 javac -d build/cache-check app/src/main/java/vn/nanase/hako/DownloadLedger.java tests/DownloadLedgerTest.java
          timeout 15 java -cp build/cache-check vn.nanase.hako.DownloadLedgerTest
      - name: Check download scope regression
        run: |
          timeout 30 javac -d build/cache-check app/src/main/java/vn/nanase/hako/DownloadScope.java app/src/main/java/vn/nanase/hako/CachePolicy.java tests/DownloadScopeTest.java
          timeout 15 java -cp build/cache-check vn.nanase.hako.DownloadScopeTest
      - name: Check shelf anchor regression
        run: |
          timeout 30 javac -d build/cache-check app/src/main/java/vn/nanase/hako/ShelfAnchor.java tests/ShelfAnchorTest.java
          timeout 15 java -cp build/cache-check vn.nanase.hako.ShelfAnchorTest
      - name: Check reading range regression
        run: |
          timeout 30 javac -d build/cache-check app/src/main/java/vn/nanase/hako/FetchPolicy.java tests/ReadingRangeTest.java
          timeout 15 java -cp build/cache-check vn.nanase.hako.ReadingRangeTest
      - name: Check shelf pagination regression
        run: |
          timeout 30 javac -d build/cache-check app/src/main/java/vn/nanase/hako/ShelfPagePolicy.java tests/ShelfPagePolicyTest.java
          timeout 15 java -cp build/cache-check vn.nanase.hako.ShelfPagePolicyTest
      - name: Install SDK and build once
        run: |
          timeout 180 sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          timeout 600 gradle -I ci/version.gradle assembleRelease -Pabi=armeabi-v7a --no-daemon --stacktrace
          mkdir -p build/deliver
          cp app/build/outputs/apk/release/app-release.apk build/deliver/Hako-Pocket-0.7.13-Gecko.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hako-Pocket-0.7.13-Gecko
          path: build/deliver/*.apk
