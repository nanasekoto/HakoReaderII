name: Build Gecko reading and shelf features
on:
  push:
    branches: [ 'feature/shelf-priority-home' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Install SDK and build once
        run: |
          timeout 180 sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          timeout 600 gradle assembleRelease -Pabi=armeabi-v7a --no-daemon --stacktrace
          mkdir -p build/deliver
          cp app/build/outputs/apk/release/app-release.apk build/deliver/Hako-Pocket-0.7.4-Gecko.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hako-Pocket-0.7.4-Gecko
          path: build/deliver/*.apk
