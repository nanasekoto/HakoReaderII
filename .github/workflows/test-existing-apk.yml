name: Test existing APK at fc1b545
on:
  push:
    branches: [ 'codex/test-existing-fc1b545' ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-30;default;x86_64'
      - name: Download existing main APK (no app rebuild)
        uses: actions/download-artifact@v4
        with:
          name: HakoPocket-APK
          path: build/existing-apk
          run-id: 37344228704
          github-token: ${{ github.token }}
      - name: Compile test harness only
        run: |
          mkdir -p build/classes
          javac -encoding UTF-8 -cp "$ANDROID_HOME/platforms/android-35/android.jar:libs/jsoup.jar" -d build/classes app/src/main/java/vn/nanase/hako/*.java
          jar cf build/classes.jar -C build/classes .
          bash test-android.sh
          sha256sum build/existing-apk/app-debug.apk
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test installed APK at 480x800
        run: bash scripts/emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Existing-APK-fc1b545-test-evidence
          path: build/evidence/
