name: Build Hako Pocket
on:
  push:
    branches: [ main, fix/snapshot-startup-0722 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          timeout 180 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'system-images;android-30;default;x86_64'
      - name: Test and build ARM32
        run: timeout 600 bash build.sh --stacktrace
      - name: Verify APK
        run: |
          python3 scripts/verify-apk.py build/deliver/*.apk
          version=$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r')
          code=$(sed -n 's/^VERSION_CODE=//p' version.properties | tr -d '\r')
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk)
          [[ "$badging" == *"package: name='vn.nanase.hako' versionCode='$code' versionName='$version'"* ]]
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum build/deliver/*.apk > build/deliver/SHA256.txt
          cp version.properties gecko-version.txt build/deliver/
      - name: Build Android regression tests
        run: |
          gradle assembleDebug -Pabi=x86_64 --no-daemon
          jar cf build/classes.jar -C app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes .
          bash test-android.sh
      - name: Verify reading and image cache on Android 11
        run: |
          sudo chmod a+rw /dev/kvm
          bash scripts/reading-state-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hako-0.7.22-validation
          path: build/evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: Hako-Pocket-0.7.22-ARM32-tested
          path: build/deliver/
