name: Build Hako Pocket APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Install SDK
      run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
    - name: Build ARM32 Lite APK
      run: gradle assembleRelease -Pabi=armeabi-v7a --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hako-Pocket-0.7.0-Lite-arm32
        path: "app/build/outputs/apk/release/app-release.apk"

