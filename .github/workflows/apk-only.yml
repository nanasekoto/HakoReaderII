name: Build APK only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Install build SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Assemble signed production APK
        run: |
          node -e "require('fs').writeFileSync('app/src/main/assets/build-info.json',JSON.stringify({commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString(),validation:'Owner requested build only; no tests run'}))"
          gradle --no-daemon assembleRelease -Pqa=false -Pabi=armeabi-v7a --stacktrace
          version=$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r')
          mkdir -p build/deliver
          cp app/build/outputs/apk/release/app-release.apk "build/deliver/Hako-Pocket-${version}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cd build/deliver
          sha256sum *.apk > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Hako-Pocket-APK-${{ github.run_number }}
          path: build/deliver/
