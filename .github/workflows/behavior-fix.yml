name: Verify Gecko Lite 0.7.0
on:
  push:
    branches: [ 'codex/behavior-fix-051' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android tools
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'system-images;android-30;default;x86_64'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Resolve stable Gecko version
        run: |
          python3 scripts/select-gecko.py
          cat gecko-version.txt
      - name: Build ARM32 Lite and emulator APK
        run: |
          bash test.sh
          gradle assembleRelease -Pabi=armeabi-v7a --stacktrace
          mkdir -p build/lite
          cp app/build/outputs/apk/release/app-release.apk build/lite/Hako-Pocket-0.7.0-Lite-arm32.apk
          cp gecko-version.txt build/lite/
          python3 - <<'PY'
          import zipfile
          p='build/lite/Hako-Pocket-0.7.0-Lite-arm32.apk'
          with zipfile.ZipFile(p) as z:
            libs=[n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
            assert any(n.endswith('/libxul.so') for n in libs), 'Gecko engine missing'
            assert libs and all(n.startswith('lib/armeabi-v7a/') for n in libs), 'APK must contain ARM32 only'
            print('ARM32 verified:',len(libs),'native libraries')
          PY
          gradle assembleDebug -Pabi=x86_64 --stacktrace
          jar cf build/classes.jar -C app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes .
          bash test-android.sh
          python3 scripts/split-apk.py
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run installed APK at 480x800
        run: bash scripts/emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hako-0.7.0-Lite-evidence
          path: build/evidence/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hako-0.7.0-Lite-tested-APK
          path: |
            build/lite/Hako-Pocket-0.7.0-Lite-arm32.apk
            build/lite/gecko-version.txt
            build/lite/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hako-0.7.0-Lite-transfer-01
          path: build/lite/parts/part-01
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hako-0.7.0-Lite-transfer-02
          path: build/lite/parts/part-02
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hako-0.7.0-Lite-transfer-03
          path: build/lite/parts/part-03
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
