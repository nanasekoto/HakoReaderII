name: Verify Gecko Lite 0.7.0
on:
  push:
    branches: [ 'codex/behavior-fix-051' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-30;default;x86_64'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Resolve stable Gecko version
        run: |
          if [ ! -f gecko-version.txt ]; then
            curl --fail --retry 2 --max-time 60 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml -o /tmp/gecko.xml
            python3 - <<'PY'
          import re, xml.etree.ElementTree as E
          vs=[v.text for v in E.parse('/tmp/gecko.xml').findall('.//version') if re.fullmatch(r'\d+\.0\.\d+',v.text)]
          assert vs
          open('gecko-version.txt','w').write(max(vs,key=lambda s:tuple(map(int,s.split('.'))))+'\n')
          PY
          fi
          cat gecko-version.txt
      - name: Build ARM32 Lite and emulator APK
        run: |
          bash test.sh
          gradle assembleRelease -Pabi=armeabi-v7a --stacktrace
          mkdir -p build/lite
          cp app/build/outputs/apk/release/app-release.apk build/lite/Hako-Pocket-0.7.0-Lite-arm32.apk
          cp gecko-version.txt build/lite/
          gradle assembleDebug -Pabi=x86_64 --stacktrace
          jar cf build/classes.jar -C app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes .
          bash test-android.sh
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run installed APK at 480x800
        run: bash scripts/emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hako-0.7.0-Lite-evidence
          path: build/evidence/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hako-0.7.0-Lite-tested-APK
          path: build/lite/
