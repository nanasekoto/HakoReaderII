name: Verify behavior fix 0.5.3
on:
  push:
    branches: [ 'codex/behavior-fix-051' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android tools
        run: sdkmanager 'platforms;android-34' 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-30;default;x86_64'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Build test APK and test harness
        run: |
          bash test.sh
          gradle assembleDebug --stacktrace
          mkdir -p build/classes
          javac -encoding UTF-8 -cp "$ANDROID_HOME/platforms/android-35/android.jar:libs/jsoup.jar" -d build/classes app/src/main/java/vn/nanase/hako/*.java
          jar cf build/classes.jar -C build/classes .
          bash test-android.sh
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run installed APK at 480x800
        run: bash scripts/emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hako-0.5.3-behavior-evidence
          path: build/evidence/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hako-0.5.3-tested-APK
          path: app/build/outputs/apk/debug/app-debug.apk
